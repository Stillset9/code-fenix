<!DOCTYPE html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Code Fenix — Prometheon Studio</title>
<meta name="description" content="Code Fenix: metroidvania soulslike gótico gratuito de Prometheon Studio. Jugalo en el navegador, en PC o en el celular.">
<meta name="theme-color" content="#0a0610">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Code Fenix">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;position:fixed;inset:0}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
  /* Controles táctiles: solo en dispositivos táctiles */
  #touch{display:none;position:fixed;inset:0;z-index:5;touch-action:none}
  body.touch #touch{display:block}
  .tbtn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
    background:radial-gradient(circle at 35% 30%,rgba(90,80,100,.42),rgba(20,16,28,.42));border:2px solid rgba(201,162,74,.55);
    color:rgba(240,230,210,.85);font-family:Georgia,serif;letter-spacing:.05em;text-shadow:0 1px 2px #000;pointer-events:auto}
  .tbtn.big{border-width:3px}
  .tbtn.on{background:radial-gradient(circle,rgba(255,170,80,.6),rgba(120,50,20,.5));border-color:#ffd860;color:#fff}
  #stickBase{position:absolute;left:5vmin;bottom:6vmin;width:30vmin;height:30vmin;border-radius:50%;border:2px solid rgba(201,162,74,.45);
    background:radial-gradient(circle,rgba(60,50,70,.25),rgba(10,8,14,.35));pointer-events:none}
  #stickBase.on{border-color:rgba(255,216,96,.8)}
  #stickKnob{position:absolute;left:50%;top:50%;width:13vmin;height:13vmin;margin:-6.5vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(230,210,180,.65),rgba(120,90,60,.55));border:2px solid rgba(255,216,96,.6)}
  body[data-mode=cine] #touch .tbtn:not([data-a=pause]),body[data-mode=cine] #stickBase{display:none}
  body[data-mode=menu] #touch .tbtn[data-a=heal],body[data-mode=menu] #touch .tbtn[data-a=spell],body[data-mode=menu] #touch .tbtn[data-a=parry],body[data-mode=menu] #touch .tbtn[data-a=shoot],
  body[data-mode=menu] #touch .tbtn[data-a=quick],body[data-mode=menu] #touch .tbtn[data-a=cycle],body[data-mode=menu] #touch .tbtn[data-a=heavy]{opacity:.35}
  #rotate{display:none;position:fixed;inset:0;z-index:10;background:#07050c;color:#e8dcc4;font-family:Georgia,serif;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #rotate p{font-size:6vmin;margin:4vmin 0 1vmin} #rotate small{color:#8a8094;font-size:3.6vmin}
  #rotate .phone{width:18vmin;height:30vmin;border:1vmin solid #c9a24a;border-radius:3vmin;animation:rot 2s ease-in-out infinite}
  @keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait){ body.touch #rotate{display:flex} }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<script src="firebase-config.js"></script>
<script src="js/font.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>
<script src="js/bg.js"></script>
<script src="js/data.js"></script>
<script src="js/rooms.js"></script>
<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/hires.js"></script>
<script src="js/rig.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui2.js"></script>
<script src="js/cine.js"></script>
<script src="js/touch.js"></script>
<script src="js/cloud.js"></script>
<script>
  // Instalación y juego sin conexión (PWA). Solo funciona servido por http(s), no abriendo el archivo directamente.
  if(location.protocol.startsWith('http')){
    const l=document.createElement('link'); l.rel='manifest'; l.href='manifest.webmanifest'; document.head.appendChild(l);
    if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
